[project]
name = "amaze-go-api"
version = "1.0.0"
description = "Amaze Go arrow puzzle engine and agent-ready FastAPI API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "firebase-admin>=7.2,<8",
  "pydantic-settings>=2.12,<3",
  "openai>=2,<4",
  "pillow>=12,<13",
  "cryptography>=46,<49",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.15,<1",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "backend.app.main:app"
